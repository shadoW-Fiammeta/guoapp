name: Build Windows desktop

on:
  push:
    branches: ['codex/windows-desktop']
  workflow_dispatch:
    inputs:
      edition:
        description: '选择站源版本'
        type: choice
        options: [all, hongguo]
        default: all

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      BUILD_EDITION: ${{ inputs.edition || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        id: mingw
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Configure compiler
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.mingw.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format desktop changes
        run: dart format lib/desktop_layout.dart lib/home_screen.dart lib/detail_screen.dart lib/player_screen.dart lib/search_input.dart lib/widgets.dart lib/main.dart lib/app_layout.dart test/desktop_layout_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test desktop layout and search
        run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true test/desktop_layout_test.dart test/search_input_test.dart
      - name: Build portable Windows package
        shell: pwsh
        run: |
          if ($env:BUILD_EDITION -eq 'all') {
            python scripts/build_windows.py --all-sources
          } else {
            python scripts/build_windows.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ inputs.edition || 'all' }}
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
